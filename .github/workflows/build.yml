name: Build Hazi Music APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek file wajib
        run: |
          for f in main.dart pubspec.yaml icon.png icon_fg.png debug.keystore; do
            [ -f "$f" ] || { echo "::error::File $f belum ada di root repo"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate folder android
        run: flutter create . --platforms=android --org com.hazi --project-name hazi_music

      - name: Pasang kode app
        run: cp main.dart lib/main.dart

      - name: Atur nama app dan izin internet
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Hazi Music"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M

      - name: Pakai keystore tetap (supaya SHA-1 login Google konsisten)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA-1"

      - run: flutter pub get

      - name: Tambal plugin webview (kompatibel Gradle baru)
        run: |
          find ~/.pub-cache -path '*flutter_inappwebview_android*' -name build.gradle -exec sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' {} +

      - name: Buat ikon app dari logo
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: HaziMusic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
