name: Build Hazi Music APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate folder android
        run: flutter create . --platforms=android --org com.hazi --project-name hazi_music

      - name: Atur nama app dan izin internet
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Hazi Music"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M

      - name: Pakai keystore tetap (supaya SHA-1 login Google konsisten)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore 2>/dev/null || cp keystore/debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA-1"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: HaziMusic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
